name: Pearl Flow native verification
on:
  push:
    branches: [pearl-flow-macos-check]
    paths:
      - '.github/workflows/pearl-native-check.yml'
      - 'submodules/ChatListUI/Sources/Node/ChatListItem.swift'
      - 'submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoHeaderActionButtonNode.swift'
      - 'submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoHeaderButtonNode.swift'
      - 'submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoHeaderNode.swift'
      - 'submodules/TelegramUI/Components/PeerInfo/PeerInfoCoverComponent/Sources/PeerInfoGiftsCoverComponent.swift'
      - 'submodules/SettingsUI/Sources/Themes/ThemeSettingsController.swift'
      - 'submodules/TelegramUI/Components/AudioWaveformComponent/Sources/AudioWaveformComponent.swift'
      - 'submodules/TelegramUI/Components/Chat/ChatMessageInteractiveFileNode/Sources/ChatMessageInteractiveFileNode.swift'
permissions:
  contents: read
concurrency:
  group: pearl-native-verification
  cancel-in-progress: false
jobs:
  simulator-build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Parse modified Swift source
        run: |
          xcrun swiftc -frontend -parse submodules/ChatListUI/Sources/Node/ChatListItem.swift
          xcrun swiftc -frontend -parse submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoHeaderActionButtonNode.swift
          xcrun swiftc -frontend -parse submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoHeaderButtonNode.swift
          xcrun swiftc -frontend -parse submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoHeaderNode.swift
          xcrun swiftc -frontend -parse submodules/TelegramUI/Components/PeerInfo/PeerInfoCoverComponent/Sources/PeerInfoGiftsCoverComponent.swift
          xcrun swiftc -frontend -parse submodules/SettingsUI/Sources/Themes/ThemeSettingsController.swift
          xcrun swiftc -frontend -parse submodules/TelegramUI/Components/AudioWaveformComponent/Sources/AudioWaveformComponent.swift
          xcrun swiftc -frontend -parse submodules/TelegramUI/Components/Chat/ChatMessageInteractiveFileNode/Sources/ChatMessageInteractiveFileNode.swift
      - name: Fetch upstream submodules
        run: |
          git submodule init
          git config submodule.submodules/rlottie/rlottie.url https://github.com/TelegramMessenger/rlottie.git
          git config submodule.submodules/TgVoipWebrtc/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git
          git submodule update --recursive --depth 1
      - name: Create compile-only configuration
        run: |
          python3 - <<'PY'
          import json
          config = json.load(open('build-system/template_minimal_development_configuration.json'))
          config.update(bundle_id='org.pearlflow.compilecheck', api_id='0', api_hash='00000000000000000000000000000000', team_id='PEARLCHECK0', app_specific_url_scheme='pearlflow')
          with open('build-system/pearl-compile-only.json', 'w') as output:
              json.dump(config, output)
          PY
          echo 'Compile verification only. API credentials are intentionally invalid; this is not a usable Telegram client.' >> "$GITHUB_STEP_SUMMARY"
      - name: Build full Telegram simulator target
        shell: bash
        run: |
          set -euo pipefail
          # Simulator-only: use Telegram's existing provisioning switch.
          echo 'build --//Telegram:disableProvisioningProfiles' >> .bazelrc
          python3 build-system/Make/Make.py build --configurationPath=build-system/pearl-compile-only.json --xcodeManagedCodesigning --buildNumber=1 --configuration=debug_sim_arm64 2>&1 | tee pearl-build.log
      - name: Preserve simulator application
        uses: actions/upload-artifact@v4
        with:
          name: pearl-simulator-compile-only
          path: bazel-bin/Telegram/Telegram.ipa
          if-no-files-found: error
          retention-days: 3
      - name: Launch in a clean iOS simulator
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pearl-smoke
          unzip -q bazel-bin/Telegram/Telegram.ipa -d pearl-smoke/stage
          APP="$PWD/pearl-smoke/stage/Payload/Telegram.app"
          test -d "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl list runtimes --json > pearl-smoke/runtimes.json
          RUNTIME=$(python3 - <<'PY'
          import json
          runtimes = [r for r in json.load(open('pearl-smoke/runtimes.json'))['runtimes'] if r.get('isAvailable') and 'SimRuntime.iOS-' in r['identifier']]
          if not runtimes:
              raise SystemExit('No available iOS runtime')
          print(max(runtimes, key=lambda r: tuple(map(int, r['version'].split('.'))))['identifier'])
          PY
          )
          DEVICE=$(xcrun simctl create PearlFlowSmoke com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$RUNTIME")
          trap 'xcrun simctl shutdown "$DEVICE" || true' EXIT
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" "$BUNDLE" | tee pearl-smoke/launch.log
          PID=$(sed -n 's/.*: \([0-9][0-9]*\)$/\1/p' pearl-smoke/launch.log)
          test -n "$PID"
          sleep 15
          kill -0 "$PID"
          xcrun simctl io "$DEVICE" screenshot pearl-smoke/launch.png
          echo 'Simulator startup survived 15 seconds. This does not verify login, themes, messages or calls; API credentials remain intentionally invalid.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve simulator startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pearl-simulator-startup
          path: |
            pearl-smoke/launch.log
            pearl-smoke/launch.png
            pearl-smoke/runtimes.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pearl-build-log
          path: pearl-build.log
          if-no-files-found: ignore
          retention-days: 3
